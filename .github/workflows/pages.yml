name: Publish encyclopedia
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/*.cjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check JavaScript
        run: |
          node --check site/app.js
          node --check site/data.js
          node scripts/validate-data.cjs
          node scripts/test-data.cjs
      - name: Prepare public files
        run: |
          mkdir -p _public
          cp site/index.html site/style.css site/data.js site/app.js _public/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _public
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4

